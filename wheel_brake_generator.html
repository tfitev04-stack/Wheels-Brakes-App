<title>Cambio de rueda / freno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141414;
    --panel:#1a1c1e;
    --panel2:#222528;
    --stroke:#2b2e32;
    --text:#f3f4f5;
    --muted:#8b9096;
    --muted2:#5c6066;
    --wheel:#3d8bff;
    --brake:#ff5d4d;
    --accent-grad:linear-gradient(135deg,#3d8bff,#6f5bff);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--text);height:100%;
    overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;}
  .screen{max-width:440px;margin:0 auto;height:100%;height:100dvh;
    display:flex;flex-direction:column;justify-content:flex-start;
    padding:10px 0 8px;overflow:hidden;}

  .card{background:var(--panel);border:1px solid var(--stroke);border-radius:14px;
    margin:0 12px 0;padding:12px;}
  .field{margin-bottom:8px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:10px;letter-spacing:.08em;color:var(--muted);
    margin-bottom:4px;font-weight:700;text-transform:uppercase;}
  .field input, .field select{
    width:100%;background:var(--panel2);border:1px solid var(--stroke);border-radius:10px;
    color:var(--text);font-size:15px;padding:9px 12px;font-family:'Manrope',sans-serif;
    font-weight:600;letter-spacing:.3px;appearance:none;-webkit-appearance:none;}
  .field select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0L5 6L10 0' fill='none' stroke='%238b9096' stroke-width='1.4'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;padding-right:30px;}
  .field input::placeholder{color:#4a4e53;}
  .field input:focus, .field select:focus{outline:none;border-color:var(--wheel);}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .typecells{display:flex;gap:8px;}
  .typecell{flex:1;text-align:center;padding:9px 0;border-radius:10px;font-size:14px;
    font-weight:700;color:var(--muted);background:var(--panel2);border:1px solid var(--stroke);
    cursor:pointer;letter-spacing:.3px;transition:all .12s ease;}
  .typecell:active{transform:scale(.97);}
  .typecell.active{background:var(--accent-grad);color:#fff;border-color:transparent;}
  .regbox{display:flex;align-items:stretch;background:var(--panel2);border:1px solid var(--stroke);
    border-radius:10px;overflow:hidden;}
  .regbox .prefix{display:flex;align-items:center;padding:0 0 0 12px;font-size:16px;
    font-weight:700;letter-spacing:.3px;color:var(--muted);}
  .regbox input{border:none;background:transparent;border-radius:0;padding-left:2px;}
  .regbox input:focus{outline:none;}

  .hint{text-align:center;font-size:11px;font-weight:600;color:var(--muted2);
    letter-spacing:.02em;margin:8px 26px 0;transition:opacity .2s;}

  .stage{margin:6px 12px 0;position:relative;background:
      radial-gradient(ellipse 80% 55% at 50% 38%, #191b1e 0%, #141414 72%);
    border:1px solid var(--stroke);border-radius:18px;padding:4px;overflow:hidden;}
  .stage-inner{position:relative;width:100%;}
  .stage-inner img{display:block;width:100%;height:auto;border-radius:10px;}

  .whit{position:absolute;transform:translate(-50%,-50%);z-index:4;cursor:pointer;}
  .wfill{position:absolute;transform:translate(-50%,-50%);border-radius:999px;
    background:transparent;transition:background .15s ease;pointer-events:none;z-index:3;}
  .wnum{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:5;
    font-size:11px;font-weight:800;color:#a7adb4;
    background:rgba(10,11,13,.55);padding:1px 4px;border-radius:4px;transition:all .15s ease;}
  .wnum.on{color:#eaf2ff;background:rgba(61,139,255,.6);}

  .bhit{position:absolute;transform:translate(-50%,-50%);z-index:4;cursor:pointer;}
  .bdot{position:absolute;transform:translate(-50%,-50%);width:17px;height:17px;
    border-radius:50%;border:2px solid #4a4f55;background:var(--bg);
    transition:all .15s ease;pointer-events:none;z-index:3;}
  .bdot.on{background:var(--brake);border-color:var(--brake);
    box-shadow:0 0 0 6px rgba(255,93,77,.2);}
  .bnum{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:5;
    font-size:11px;font-weight:800;color:var(--brake);
    background:rgba(10,11,13,.55);padding:1px 4px;border-radius:4px;
    opacity:0;transition:opacity .15s ease;}
  .bnum.on{opacity:1;}

  .legend{margin:6px 18px 0;display:flex;justify-content:center;gap:20px;}
  .legend .item{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted);}
  .legend .sw{width:9px;height:9px;border-radius:50%;}
  .legend .sw.w{background:var(--wheel);}
  .legend .sw.b{background:var(--brake);}

  .listcard{margin:8px 12px 0;background:var(--panel);border:1px solid var(--stroke);
    border-radius:14px;padding:8px 14px;min-height:22px;}
  .listcard .empty{text-align:center;font-size:12px;color:var(--muted2);padding:3px 0;font-weight:500;}
  .sel-line{display:flex;align-items:center;justify-content:space-between;padding:6px 0;}
  .sel-line+.sel-line{border-top:1px solid var(--stroke);}
  .sel-line .code{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;letter-spacing:.3px;}
  .sel-line .rm{color:var(--muted2);font-size:15px;padding:4px 6px;}

  .actions{margin:8px 12px 0;display:flex;gap:10px;}
  .btn{flex:1;padding:12px 0;text-align:center;border-radius:13px;font-size:15px;font-weight:700;
    border:1px solid var(--stroke);background:var(--panel2);color:var(--text);cursor:pointer;}
  .btn.primary{background:var(--accent-grad);border:none;color:#fff;}
  .btn.primary:disabled{opacity:.35;}
  .btn:active{opacity:.8;}

  .genhint{font-size:12px;color:var(--muted);margin:8px 12px 0;text-align:center;font-weight:500;}

  .modal-overlay{position:fixed;inset:0;background:rgba(8,9,10,.72);display:none;
    align-items:center;justify-content:center;z-index:50;padding:22px;}
  .modal-overlay.show{display:flex;}
  .modal-card{background:var(--panel);border:1px solid var(--stroke);border-radius:18px;
    padding:14px;max-width:400px;width:100%;max-height:88vh;overflow:auto;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;
    font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;}
  .modal-close{cursor:pointer;color:var(--muted);font-size:15px;padding:4px 6px;}
  #outImg{width:100%;border-radius:14px;border:1px solid var(--stroke);display:none;}
  .copybtn{width:100%;margin-top:10px;padding:13px 0;text-align:center;border-radius:13px;
    font-size:15px;font-weight:700;border:none;background:var(--accent-grad);
    color:#fff;cursor:pointer;}
  .copybtn:active{opacity:.8;}
</style>
</head>
<body>
<div class="screen">

  <div class="card">
    <div class="row2">
      <div class="field">
        <label for="matSuffix">Matrícula</label>
        <div class="regbox">
          <span class="prefix">EC-</span>
          <input id="matSuffix" type="text" placeholder="ABC" maxlength="3" autocapitalize="characters">
        </div>
      </div>
      <div class="field">
        <label for="parking">Parking</label>
        <input id="parking" type="text" placeholder="R12" maxlength="8" autocapitalize="characters">
      </div>
    </div>
    <div class="field">
      <label>Tipo de avión</label>
      <div class="typecells" id="typeCells">
        <div class="typecell" data-type="A319">A319</div>
        <div class="typecell" data-type="A320">A320</div>
        <div class="typecell" data-type="A321">A321</div>
      </div>
    </div>
  </div>

  <p class="hint" id="stageHint">Toca una rueda o un freno para marcarlo</p>

<script>
const POSITIONS = [
  {code:'NLG1', num:'1', cx:48.29, cy:15.45, w:2.18, h:4.25, brake:false},
  {code:'NLG2', num:'2', cx:51.23, cy:15.45, w:2.05, h:4.25, brake:false},
  {code:'MLG1', num:'1', cx:37.25, cy:50.00, w:3.55, h:4.48, brake:true},
  {code:'MLG2', num:'2', cx:40.93, cy:50.00, w:3.55, h:4.48, brake:true},
  {code:'MLG3', num:'3', cx:58.53, cy:50.00, w:3.55, h:4.48, brake:true},
  {code:'MLG4', num:'4', cx:62.21, cy:50.00, w:3.55, h:4.48, brake:true},
];
const wheelSel = {};
const brakeSel = {};
const stageInner = document.getElementById('stageInner');
const planeImg = document.getElementById('planeImg');

function wheelLabel(code){
  const num = code.replace(/\D/g,'');
  const prefix = code.startsWith('NLG') ? 'NLG' : 'MLG';
  return prefix + ' #' + num;
}
function brakeLabel(code){
  const num = code.replace(/\D/g,'');
  return 'Brake #' + num;
}

const BRAKE_OFFSET = 6.5;

function buildMarkers(){
  POSITIONS.forEach(p=>{
    let minGap = Infinity;
    POSITIONS.forEach(q=>{
      if(q.code!==p.code){
        const d = Math.abs(q.cx-p.cx);
        if(d < minGap) minGap = d;
      }
    });
    const hitW = Math.min(p.w+4.2, minGap*0.86);
    const vPad = p.brake ? 1.8 : 4.0;
    const hitH = p.h + vPad*2;

    const hit = document.createElement('div');
    hit.className = 'whit';
    hit.id = 'h-'+p.code;
    hit.style.left = p.cx+'%';
    hit.style.top = p.cy+'%';
    hit.style.width = hitW+'%';
    hit.style.height = hitH+'%';
    hit.addEventListener('click', ()=>{ wheelSel[p.code] = !wheelSel[p.code]; render(); });
    stageInner.appendChild(hit);

    const fill = document.createElement('div');
    fill.className = 'wfill';
    fill.id = 'f-'+p.code;
    fill.style.left = p.cx+'%';
    fill.style.top = p.cy+'%';
    fill.style.width = p.w+'%';
    fill.style.height = p.h+'%';
    stageInner.appendChild(fill);

    const num = document.createElement('div');
    num.className = 'wnum';
    num.id = 'n-'+p.code;
    num.textContent = p.num;
    num.style.left = p.cx+'%';
    num.style.top = (p.cy - p.h/2 - 1.6)+'%';
    stageInner.appendChild(num);

    if(p.brake){
      const bcy = p.cy + BRAKE_OFFSET;
      const bHitW = Math.min(5.2, minGap*0.86);
      const bHitH = 4.6;

      const bhit = document.createElement('div');
      bhit.className = 'bhit';
      bhit.id = 'bh-'+p.code;
      bhit.style.left = p.cx+'%';
      bhit.style.top = bcy+'%';
      bhit.style.width = bHitW+'%';
      bhit.style.height = bHitH+'%';
      bhit.addEventListener('click', ()=>{ brakeSel[p.code] = !brakeSel[p.code]; render(); });
      stageInner.appendChild(bhit);

      const bdot = document.createElement('div');
      bdot.className = 'bdot';
      bdot.id = 'bd-'+p.code;
      bdot.style.left = p.cx+'%';
      bdot.style.top = bcy+'%';
      stageInner.appendChild(bdot);

      const bnum = document.createElement('div');
      bnum.className = 'bnum';
      bnum.id = 'bn-'+p.code;
      bnum.textContent = p.num;
      bnum.style.left = p.cx+'%';
      bnum.style.top = (bcy + 3.6)+'%';
      stageInner.appendChild(bnum);
    }
  });
}

function render(){
  POSITIONS.forEach(p=>{
    const fill = document.getElementById('f-'+p.code);
    const num = document.getElementById('n-'+p.code);
    if(wheelSel[p.code]){
      fill.style.background = 'var(--wheel)';
      num.classList.add('on');
    } else {
      fill.style.background = 'transparent';
      num.classList.remove('on');
    }
    if(p.brake){
      document.getElementById('bd-'+p.code).classList.toggle('on', !!brakeSel[p.code]);
      document.getElementById('bn-'+p.code).classList.toggle('on', !!brakeSel[p.code]);
    }
  });

  const list = document.getElementById('listCard');
  const nlgOrder = ['NLG1','NLG2'];
  const mlgOrder = ['MLG1','MLG2','MLG3','MLG4'];
  const groups = [
    {nums: nlgOrder.filter(c=>wheelSel[c]).map(c=>c.replace(/\D/g,'')), prefix:'NLG', color:'var(--wheel)'},
    {nums: mlgOrder.filter(c=>wheelSel[c]).map(c=>c.replace(/\D/g,'')), prefix:'MLG', color:'var(--wheel)'},
    {nums: mlgOrder.filter(c=>brakeSel[c]).map(c=>c.replace(/\D/g,'')), prefix:'Brake', color:'var(--brake)'},
  ];
  let rows = '';
  groups.forEach(g=>{
    if(g.nums.length) rows += line(g.prefix+' #'+g.nums.join(', #'), g.color);
  });
  if(!rows){
    list.innerHTML = '<div class="empty">Aún no has seleccionado nada</div>';
  } else {
    list.innerHTML = rows;
  }
  const any = nlgOrder.concat(mlgOrder).some(c=>wheelSel[c]) || mlgOrder.some(c=>brakeSel[c]);
  document.getElementById('genBtn').disabled = !any;
  document.getElementById('stageHint').style.opacity = any ? '0' : '1';
}
function line(text,color){
  return '<div class="sel-line"><span class="code" style="color:'+color+'">'+text+'</span></div>';
}

let selectedTipo = null;
document.querySelectorAll('.typecell').forEach(cell=>{
  cell.addEventListener('click', ()=>{
    selectedTipo = cell.dataset.type;
    document.querySelectorAll('.typecell').forEach(c=>c.classList.toggle('active', c===cell));
  });
});

document.getElementById('matSuffix').addEventListener('input', e=>{
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
});
document.getElementById('parking').addEventListener('input', e=>{
  e.target.value = e.target.value.toUpperCase();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  Object.keys(wheelSel).forEach(k=>delete wheelSel[k]);
  Object.keys(brakeSel).forEach(k=>delete brakeSel[k]);
  document.getElementById('matSuffix').value='';
  document.getElementById('parking').value='';
  selectedTipo = null;
  document.querySelectorAll('.typecell').forEach(c=>c.classList.remove('active'));
  render();
  document.getElementById('outImg').style.display='none';
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('genHint').textContent='';
});

document.getElementById('modalClose').addEventListener('click', ()=>{
  document.getElementById('modalOverlay').classList.remove('show');
});
document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'modalOverlay') document.getElementById('modalOverlay').classList.remove('show');
});

async function ensureFonts(){
  try{
    await Promise.all([
      document.fonts.load('700 40px "Space Grotesk"'),
      document.fonts.load('700 50px "Space Grotesk"'),
      document.fonts.load('700 24px "Space Grotesk"'),
      document.fonts.load('600 14px Manrope'),
      document.fonts.load('700 11px Manrope'),
    ]);
  }catch(e){}
}

document.getElementById('genBtn').addEventListener('click', async ()=>{
  const suf = document.getElementById('matSuffix').value.trim();
  const reg = 'EC-' + suf;
  const park = document.getElementById('parking').value.trim();
  const tipo = selectedTipo;
  const hint = document.getElementById('genHint');
  const nlgOrder = ['NLG1','NLG2'];
  const mlgOrder = ['MLG1','MLG2','MLG3','MLG4'];
  const rows = [];
  const nlgNums = nlgOrder.filter(c=>wheelSel[c]).map(c=>c.replace(/\D/g,''));
  const mlgNums = mlgOrder.filter(c=>wheelSel[c]).map(c=>c.replace(/\D/g,''));
  const brakeNums = mlgOrder.filter(c=>brakeSel[c]).map(c=>c.replace(/\D/g,''));
  if(nlgNums.length) rows.push({text:'NLG #'+nlgNums.join(', #'), color:'#3d8bff'});
  if(mlgNums.length) rows.push({text:'MLG #'+mlgNums.join(', #'), color:'#3d8bff'});
  if(brakeNums.length) rows.push({text:'Brake #'+brakeNums.join(', #'), color:'#ff5d4d'});

  if(!suf){
    hint.style.color = 'var(--brake)';
    hint.textContent = 'Completa la matrícula antes de generar.';
    return;
  }
  if(!tipo){
    hint.style.color = 'var(--brake)';
    hint.textContent = 'Selecciona el tipo de avión antes de generar.';
    return;
  }
  if(rows.length === 0){
    hint.style.color = 'var(--brake)';
    hint.textContent = 'Selecciona al menos una rueda o freno.';
    return;
  }
  hint.style.color = '';
  hint.textContent = 'Generando…';
  await ensureFonts();

  const iw = planeImg.naturalWidth, ih = planeImg.naturalHeight;
  const scale = 2;
  const headerH = 178;
  const footerH = 40 + rows.length*40 + 20;
  const contentH = headerH+ih+footerH;
  let canvasW = Math.round(contentH*4/5);
  if(canvasW < iw+40) canvasW = iw+40;
  const sidePad = (canvasW - iw)/2;
  const cX = canvasW/2;

  const canvas = document.createElement('canvas');
  canvas.width = canvasW*scale;
  canvas.height = contentH*scale;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#141414';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.scale(scale,scale);

  function eyebrow(text, x, align){
    ctx.font = '700 11px Manrope';
    ctx.fillStyle = '#6a6f75';
    ctx.textAlign = align;
    ctx.textBaseline = 'alphabetic';
    const spaced = text.split('').join('\u200a\u200a');
    ctx.fillText(spaced, x, 32);
  }

  eyebrow('MATRÍCULA', sidePad+36, 'left');
  ctx.font = '700 50px "Space Grotesk"';
  ctx.fillStyle = '#f3f4f5';
  ctx.textAlign = 'left';
  ctx.fillText(reg, sidePad+36, 82);

  eyebrow('PARKING', canvasW-sidePad-36, 'right');
  ctx.font = '700 50px "Space Grotesk"';
  ctx.fillStyle = '#f3f4f5';
  ctx.textAlign = 'right';
  ctx.fillText(park || '—', canvasW-sidePad-36, 82);

  ctx.beginPath();
  ctx.moveTo(sidePad+36, 102);
  ctx.lineTo(canvasW-sidePad-36, 102);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  ctx.stroke();

  const typeText = tipo.toUpperCase().split('').join('\u2009');
  ctx.font = '700 19px "Space Grotesk"';
  const tw = ctx.measureText(typeText).width;
  const dotR = 4, gap = 11;
  const groupW = tw + dotR*2 + gap;
  const startX = cX - groupW/2;
  ctx.beginPath();
  ctx.arc(startX+dotR, 132, dotR, 0, Math.PI*2);
  ctx.fillStyle = '#3d8bff';
  ctx.fill();
  ctx.fillStyle = '#d7dade';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(typeText, startX+dotR*2+gap, 133);
  ctx.textBaseline = 'alphabetic';

  ctx.drawImage(planeImg, sidePad, headerH, iw, ih);

  POSITIONS.forEach(p=>{
    const cx = sidePad + iw*p.cx/100, cy = headerH + ih*p.cy/100;
    if(wheelSel[p.code]){
      const w = iw*p.w/100, h = ih*p.h/100;
      const rx = Math.min(w,h)/2;
      ctx.beginPath();
      ctx.moveTo(cx-w/2+rx, cy-h/2);
      ctx.arcTo(cx+w/2, cy-h/2, cx+w/2, cy+h/2, rx);
      ctx.arcTo(cx+w/2, cy+h/2, cx-w/2, cy+h/2, rx);
      ctx.arcTo(cx-w/2, cy+h/2, cx-w/2, cy-h/2, rx);
      ctx.arcTo(cx-w/2, cy-h/2, cx+w/2, cy-h/2, rx);
      ctx.closePath();
      ctx.fillStyle = '#3d8bff';
      ctx.fill();
    }
    if(p.brake && brakeSel[p.code]){
      const bcy = headerH + ih*(p.cy+BRAKE_OFFSET)/100;
      ctx.beginPath();
      ctx.arc(cx, bcy, 15, 0, Math.PI*2);
      ctx.fillStyle = '#ff5d4d';
      ctx.fill();
    }
  });

  let footerY = headerH + ih + 44;
  ctx.textAlign = 'center';
  rows.forEach(row=>{
    ctx.font = '700 24px "Space Grotesk"';
    ctx.fillStyle = row.color;
    ctx.fillText(row.text, cX, footerY);
    footerY += 40;
  });
  ctx.restore();

  const dataUrl = canvas.toDataURL('image/png');
  const outImg = document.getElementById('outImg');
  outImg.src = dataUrl;
  outImg.style.display = 'block';
  hint.textContent = '';
  document.getElementById('modalOverlay').classList.add('show');

  const copyBtn = document.getElementById('copyBtn');
  copyBtn.textContent = 'Copiar imagen';

  canvas.toBlob(blob=>{
    window.__lastBlob = blob;
    const file = new File([blob], reg+'.png', {type:'image/png'});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      window.__shareFile = file;
    }
  }, 'image/png');
});

document.getElementById('copyBtn').addEventListener('click', async ()=>{
  const copyBtn = document.getElementById('copyBtn');
  if(!window.__lastBlob){ return; }
  try{
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([
        new ClipboardItem({'image/png': window.__lastBlob})
      ]);
      copyBtn.textContent = 'Copiada ✓';
      setTimeout(()=>{ copyBtn.textContent = 'Copiar imagen'; }, 1800);
    } else {
      throw new Error('sin soporte');
    }
  }catch(e){
    copyBtn.textContent = 'No se pudo copiar, mantén pulsada la imagen';
    setTimeout(()=>{ copyBtn.textContent = 'Copiar imagen'; }, 2400);
  }
});

document.getElementById('outImg').addEventListener('click', async ()=>{
  if(window.__shareFile){
    try{ await navigator.share({files:[window.__shareFile], title:'Cambio de rueda/freno'}); }
    catch(e){}
  }
});

buildMarkers();
render();
</script>
